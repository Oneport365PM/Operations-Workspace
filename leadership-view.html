<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>OnePort Leadership View</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: OnePort shell (dark sidebar) · summary strip → pipeline matrix + "needs attention" rail · drill-down drawer */
:root{
  --bg:#FDFBF1; --surface:#FFFFFF; --surface-2:#F4F6EF; --chip:#EDEFE8;
  --ink:#023819; --text:#383838; --muted:#6B7266;
  --line:rgba(2,56,25,.12); --line-soft:rgba(2,56,25,.07);
  --brand:#023819; --brand-fg:#FDFBF1; --brand-dim:rgba(253,251,241,.55);
  --accent:#BFFB4F; --accent-ink:#023819;
  --ok:#1F8A5B; --ok-bg:#E1F1E8; --ok-text:#0F7A45;
  --warn:#E0A800; --warn-bg:#FFF3CC; --warn-text:#8A6A00;
  --bad:#E01515; --bad-bg:#FDE0E0; --bad-text:#CC1414;
  --idle:#C3CABB; --overlay:rgba(2,24,12,.38);
  --shadow:0 2px 4px rgba(2,56,25,.05), 0 8px 20px -8px rgba(2,56,25,.14);
  --shadow-lg:0 4px 8px rgba(2,56,25,.06), 0 18px 40px -16px rgba(2,56,25,.28);
  --font-display:'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body:'Open Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1711; --surface:#15211A; --surface-2:#1B2A21; --chip:#22332A;
  --ink:#E8EEDC; --text:#CDD5C6; --muted:#8D978A;
  --line:rgba(209,219,189,.15); --line-soft:rgba(209,219,189,.08);
  --brand:#081F11; --brand-fg:#E8EEDC; --brand-dim:rgba(232,238,220,.5);
  --ok:#3DBB82; --ok-bg:rgba(61,187,130,.16); --ok-text:#74D9A9;
  --warn:#FFCC1A; --warn-bg:rgba(255,204,26,.14); --warn-text:#FFD95C;
  --bad:#FF5A5A; --bad-bg:rgba(255,90,90,.15); --bad-text:#FF8F8F;
  --idle:#46534A; --overlay:rgba(0,0,0,.55);
  --shadow:0 2px 6px rgba(0,0,0,.3); --shadow-lg:0 18px 40px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1711; --surface:#15211A; --surface-2:#1B2A21; --chip:#22332A;
  --ink:#E8EEDC; --text:#CDD5C6; --muted:#8D978A;
  --line:rgba(209,219,189,.15); --line-soft:rgba(209,219,189,.08);
  --brand:#081F11; --brand-fg:#E8EEDC; --brand-dim:rgba(232,238,220,.5);
  --ok:#3DBB82; --ok-bg:rgba(61,187,130,.16); --ok-text:#74D9A9;
  --warn:#FFCC1A; --warn-bg:rgba(255,204,26,.14); --warn-text:#FFD95C;
  --bad:#FF5A5A; --bad-bg:rgba(255,90,90,.15); --bad-text:#FF8F8F;
  --idle:#46534A; --overlay:rgba(0,0,0,.55);
  --shadow:0 2px 6px rgba(0,0,0,.3); --shadow-lg:0 18px 40px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--ink);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.shell{display:flex;min-height:100vh}
.sidebar{width:228px;flex-shrink:0;background:var(--brand);color:var(--brand-fg);padding:24px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;border-bottom:1px solid rgba(253,251,241,.12)}
.logo .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 14px var(--font-display)}
.logo .word{font:600 15px var(--font-display);color:var(--brand-fg)}
.logo .sub{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-dim)}
.nav-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-dim);font-weight:700;padding:0 10px 8px}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--brand-dim);text-decoration:none;font-weight:600;font-size:13.5px}
.nav a:hover{background:rgba(253,251,241,.08);color:var(--brand-fg)}
.nav a.active{background:var(--accent);color:var(--accent-ink)}
.side-foot{margin-top:auto;font-size:12px;color:var(--brand-dim);padding:0 10px}

.main{flex:1;min-width:0;padding-block:28px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
@media (min-width:900px){ .main{padding-left:32px;padding-right:32px} }
.topbar{display:none}
@media (max-width:899px){
  .sidebar{display:none}
  .topbar{display:flex;align-items:center;gap:10px;background:var(--brand);color:var(--brand-fg);padding-block:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .shell{flex-direction:column}
}

/* Header */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.page-head h1{font-size:26px;letter-spacing:-.01em;margin-top:2px}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:640px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--brand);color:var(--brand-fg);border-color:transparent}
.btn-primary:hover{background:var(--brand);filter:brightness(1.25)}
.btn-accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn-accent:hover{background:var(--accent);filter:brightness(.95)}
.btn-ghost{border-color:transparent;background:transparent}

.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;box-shadow:var(--shadow)}

/* How it works */
.how{display:flex;gap:14px;align-items:flex-start;padding:12px 16px;border-radius:10px;background:var(--surface-2);border:1px dashed var(--line);font-size:13px}
.how b{color:var(--ink)}
.how .flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;color:var(--ink);font-size:12.5px}
.how .flow span{padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.how .x{margin-left:auto;flex-shrink:0}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1180px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:620px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:12px;font-weight:600;color:var(--muted)}
.kpi .v{font:600 28px/1.15 var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad-text)} .kpi.warn .v{color:var(--warn-text)} .kpi.ok .v{color:var(--ok-text)}
.mix{grid-column:1/-1;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.mixbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--chip);gap:2px}
.mixbar span{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* Body grid */
.body{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1180px){ .body{grid-template-columns:minmax(0,1fr)} }
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 18px 12px}
.section-head h2{font-size:16px}
.section-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:0 18px 14px;border-bottom:1px solid var(--line-soft)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button .c{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px}
.search{flex:1;min-width:160px;max-width:260px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface)}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:13px}

/* Pipeline matrix */
.group{padding:4px 0 8px}
.group-head{display:flex;align-items:baseline;gap:10px;padding:14px 18px 8px}
.group-head h3{font-size:13.5px}
.group-head span{font-size:12px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table.matrix{border-collapse:separate;border-spacing:0;width:100%;min-width:820px}
.matrix th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap;background:var(--surface)}
.matrix th.key{text-align:center;letter-spacing:.03em;text-transform:none;font-size:11.5px;color:var(--ink);white-space:normal;min-width:104px;max-width:130px;line-height:1.25}
.matrix th.key small{display:block;font-weight:500;color:var(--muted);font-size:10.5px;margin-top:2px}
.matrix td{padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.matrix tr.row{cursor:pointer}
.matrix tr.row:hover td{background:var(--surface-2)}
.matrix th:first-child,.matrix td:first-child{padding-left:18px;position:sticky;left:0;z-index:1;background:var(--surface)}
.matrix tr.row:hover td:first-child{background:var(--surface-2)}
.ship-ref{font-weight:700;color:var(--ink);font-size:13px}
.ship-cust{font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.ship-route{font-size:11.5px;color:var(--muted);white-space:nowrap}
.tasks-cell{min-width:110px}
.tasks-cell .bar{height:6px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:4px}
.tasks-cell .bar i{display:block;height:100%;background:var(--ok)}
.tasks-cell .t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.ms{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;position:relative}
.ms .lbl{font-size:11px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.ms.done .lbl{color:var(--muted)}
.ms.late .lbl{color:var(--bad-text)}
.ms.breached .lbl{color:var(--bad-text);font-weight:700}
.ms.atrisk .lbl{color:var(--warn-text);font-weight:600}
.ms.ontrack .lbl{color:var(--ink);font-weight:600}
.ms.upcoming .lbl{color:var(--muted)}
.ms::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line-soft);z-index:0}
td.first-key .ms::before{display:none}
.glyph{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;position:relative;z-index:1;flex-shrink:0}
.glyph svg{display:block}
.g-done{background:var(--ok);color:var(--surface)}
.g-late{background:var(--surface);border:2px solid var(--bad);color:var(--bad)}
.g-breached{background:var(--bad);color:#fff}
.g-atrisk{background:var(--warn);color:#2b2100}
.g-ontrack{background:var(--surface);border:2px solid var(--ink)}
.g-ontrack::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
.g-upcoming{background:var(--surface);border:2px solid var(--idle)}
.glyph.mini{width:14px;height:14px;border-width:1.5px}.glyph.mini svg{width:8px;height:8px}.g-ontrack.mini::after{width:5px;height:5px}
.flagmark{position:absolute;top:-4px;right:-6px;width:14px;height:14px;border-radius:50%;background:var(--surface);color:var(--bad);display:grid;place-items:center;z-index:2}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad-text)}
.pill.warn{background:var(--warn-bg);color:var(--warn-text)}
.pill.ok{background:var(--ok-bg);color:var(--ok-text)}
.pill.neutral{background:var(--chip);color:var(--muted)}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}

.avatar{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font:600 10.5px var(--font-display);flex-shrink:0}
.av-dark{background:var(--brand);color:var(--accent)} .av-light{background:#D1DBBD;color:#023819} .av-gold{background:#FFCC1A;color:#023819}

/* Attention rail */
.rail{position:sticky;top:20px;display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
@media (max-width:1180px){ .rail{position:static;max-height:none} }
.att-list{overflow:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:4px}
.att{display:flex;flex-direction:column;gap:5px;padding:12px 10px;border-radius:10px;border:0;background:transparent;text-align:left;width:100%}
.att:hover{background:var(--surface-2)}
.att + .att{border-top:1px solid var(--line-soft);border-radius:0 0 10px 10px}
.att-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.att-title{font-weight:700;color:var(--ink);font-size:13.5px}
.att-meta{font-size:12px;color:var(--muted)}
.att-reason{font-size:12.5px;color:var(--text);display:flex;gap:6px;align-items:flex-start}
.att-reason svg{flex-shrink:0;margin-top:2px}
.att-owner{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.att-owner .avatar{width:20px;height:20px;font-size:9px}
.rail-tabs{padding:0 18px 10px}

/* Drawer + modal */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--bg);z-index:41;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px);padding-right:env(safe-area-inset-right, 0px)}
.drawer-head{padding:18px 22px 14px;border-bottom:1px solid var(--line-soft);background:var(--surface);display:flex;flex-direction:column;gap:10px}
.drawer-head .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.drawer-head h2{font-size:19px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px;font-size:12px}
.facts .k{color:var(--muted)} .facts .v{color:var(--ink);font-weight:600}
@media (max-width:480px){ .facts{grid-template-columns:repeat(2,minmax(0,1fr))} }
.drawer-body{overflow:auto;padding:18px 22px 28px;flex:1;display:flex;flex-direction:column;gap:6px}
.demo-note{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.stage{display:grid;grid-template-columns:22px minmax(0,1fr);gap:0 12px}
.stage .spine{display:flex;flex-direction:column;align-items:center}
.stage .spine .line{flex:1;width:2px;background:var(--line);margin:4px 0}
.stage:last-child .spine .line{display:none}
.stage-body{padding-bottom:18px;min-width:0}
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;min-height:22px}
.stage-top h4{font-size:14.5px}
.stage-sub{font-size:12px;color:var(--muted);margin-top:2px}
.stage-reason{font-size:12.5px;margin-top:6px;padding:7px 10px;border-radius:8px}
.stage-reason.bad{background:var(--bad-bg);color:var(--bad-text)}
.stage-reason.warn{background:var(--warn-bg);color:var(--warn-text)}
details.team{margin-top:8px;border:1px solid var(--line-soft);border-radius:10px;background:var(--surface)}
details.team summary{cursor:pointer;padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between;gap:8px;list-style:none}
details.team summary::-webkit-details-marker{display:none}
details.team summary::after{content:"▾";color:var(--muted)}
details.team[open] summary::after{content:"▴"}
.task{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 12px;border-top:1px solid var(--line-soft);font-size:12.5px}
.task input{margin:2px 0 0;width:16px;height:16px;accent-color:var(--ok)}
.task .tn{font-weight:600;color:var(--ink)}
.task .tn .star{color:var(--warn);margin-left:4px}
.task .tm{color:var(--muted);font-size:11.5px}
.task .tf{margin-top:4px;color:var(--bad-text);font-size:11.5px;display:flex;gap:5px}
.task .td{font-size:11.5px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.task .td.bad{color:var(--bad-text);font-weight:700} .task .td.ok{color:var(--ok-text)} .task .td.muted{color:var(--muted)}

.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.modal-head{padding:18px 22px 12px;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:10px}
.modal-head .row1{display:flex;justify-content:space-between;gap:10px}
.modal-head h2{font-size:18px}
.modal-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.modal-body{overflow:auto;padding:6px 22px}
.cfg-row{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 92px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.cfg-row .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;text-align:right}
.cfg-row .nm{font-weight:600;color:var(--ink)}
.cfg-row .nm small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.cfg-row input[type=text]{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--surface);font-size:12.5px}
.cfg-row input[type=text]:disabled{opacity:.35}
.cfg-row.on{background:linear-gradient(var(--surface-2),var(--surface-2))}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;justify-self:end}
.toggle input{width:16px;height:16px;accent-color:var(--ok)}
@media (max-width:620px){ .cfg-row{grid-template-columns:24px minmax(0,1fr) 80px} .cfg-row .lab{grid-column:2 / -1} }
.modal-foot{padding:12px 22px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--brand);color:var(--brand-fg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:13px;z-index:60;max-width:calc(100vw - 32px)}
.toast b{color:var(--accent)}
@media (prefers-reduced-motion: no-preference){
  .drawer{animation:slide .22s ease-out}

  try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ const k = JSON.parse(raw); if(TPL_ORDER.every(t=>k[t])) return k; } }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_KEYS));
}

let KEYS = loadKeys();

/* Team (same people as the Admin Portal, plus field roles) */
const TEAM = {

  u4:{name:'Titi Aluko', fill:'gold'}, u5:{name:'Chidi Eze', fill:'dark'}, u6:{name:'Ada Nwosu', fill:'light'},
  u7:{name:'Bola Okafor', fill:'gold'}, u8:{name:'Emeka Obi', fill:'dark'}, u9:{name:'Funmi Bakare', fill:'light'},
};
const RESP_POOL = {
  'Operations Manager':['u1','u2'], 'Operations Officer':['u2','u9'], 'Documentation Officer':['u5'],
  'Finance Officer':['u6'], 'QA Officer':['u9','u2','u5'], 'Clearing Officer':['u4','u7'],

/* =========================================================================
   Sample shipments. Each one is simulated as a team working through its
   Progress tab: "pace" says how far behind (+) or ahead (−) of the task
   due dates the team is running.
   ========================================================================= */
const SCENARIOS = {
  smooth:{lag:-.8, late:[-.6,.1]}, slight:{lag:-.2, late:[-.5,.4]},
  late:{lag:1.1, late:[-.3,.8]}, stalled:{lag:2.4, late:[-.2,1.1]}, blocked:{lag:-.3, late:[-.4,.3], flag:true},
};
const FLAG_NOTES = [
  'Customer yet to fund duty — awaiting PAAR confirmation.',
  'Examination booked but terminal is congested; NCS officers not on site.',
  'Shipping line demanding demurrage deposit before releasing TDO.',
  'Form M still pending approval at the customer\'s bank.',
  'No truck available until Thursday — haulage partner short on equipment.',
  'Airline offloaded cargo to next flight due to space.',
];
const SHIPMENTS_SPEC = [
  ['ZELO000001','Dangote Industries','oi','Shanghai','Lagos (Apapa)',14,'smooth'],
  ['ZELO000002','Nestlé West Africa','oi','Rotterdam','Tema',20,'late'],
  ['ZELO000003','Julius Berger Nigeria','oi','Hamburg','Lagos (Apapa)',21,'stalled',0],
  ['ZELO000005','Dufil Prima Foods','oe','Lagos (Apapa)','Douala',6,'smooth'],
  ['ZELO000007','MTN Nigeria','ai','Shenzhen','Lagos (MMIA)',3.2,'blocked',5],
  ['ZELO000008','Flour Mills of Nigeria','oi','Santos','Lagos (Tin Can)',9,'smooth'],
  ['ZELO000009','Olam Agri','oe','Lagos (Apapa)','Antwerp',3,'smooth'],
  ['ZELO000010','Seplat Energy','ai','Houston','Port Harcourt',5,'late'],
  ['ZELO000011','PZ Cussons Nigeria','oi','Felixstowe','Lagos (Apapa)',4,'smooth'],
  ['ZELO000012','Lafarge Africa','oi','Izmir','Onne',16,'blocked',2],
  ['ZELO000013','Cadbury Nigeria','oe','Lagos (Apapa)','Rotterdam',8,'late'],
  ['ZELO000014','Jumia Nigeria','ai','Dubai','Lagos (MMIA)',2,'smooth'],
  ['ZELO000015','Nigerian Bottling Co.','oi','Jebel Ali','Lagos (Tin Can)',12,'slight'],
  ['ZELO000016','Indorama Eleme','ae','Port Harcourt','Frankfurt',3,'smooth'],
  ['ZELO000017','Promasidor','oi','Durban','Lagos (Apapa)',23,'slight'],
  ['ZELO000018','GZ Industries','oi','Ningbo','Lagos (Tin Can)',10,'stalled',4],
  ['ZELO000019','Unilever Nigeria','ae','Lagos (MMIA)','London (LHR)',4,'blocked',3],

const HOUR=3600e3, DAY=86400e3;
let NOW = new Date();
function rng(seed){ let s=(seed*2654435761)>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }

function buildShipment(spec, idx){
  const [ref, customer, tpl, from, to, daysAgo, scen, flagNote] = spec;
  const T = TEMPLATES[tpl], S = SCENARIOS[scen], r = rng(idx+7);
  const start = new Date(NOW.getTime() - daysAgo*DAY); start.setMinutes(0,0,0);
  const owners = {};
  Object.keys(RESP_POOL).forEach((resp,i)=>{ const pool=RESP_POOL[resp]; owners[resp]=pool[(idx+i)%pool.length]; });
  let cursor = start.getTime(), prevDone = start.getTime();
  const hours = [10,12,14,16,17];
  const tasks = T.tasks.map((t,i)=>{
    cursor += t.d*T.perDay*DAY;
    const due = new Date(cursor); due.setHours(hours[(i+idx)%hours.length],0,0,0);
    const task = {name:t.name, resp:t.resp, sla:t.sla||null, owner:owners[t.resp], due, done:false, completedAt:null, flag:null};
    if(due.getTime() <= NOW.getTime() - S.lag*DAY){
      let at = due.getTime() + (S.late[0] + r()*(S.late[1]-S.late[0]))*DAY;
      at = Math.max(at, prevDone + HOUR*(.25+r()*.75));
      if(at < NOW.getTime() - 20*60e3){ task.done = true; task.completedAt = new Date(at); prevDone = at; }
    }
    return task;
  });
  if(S.flag || flagNote!==undefined){
    const open = tasks.find(t=>!t.done);
    if(open){
      const by = open.owner;
      open.flag = {note: FLAG_NOTES[(flagNote ?? idx) % FLAG_NOTES.length], by, at:new Date(NOW.getTime() - (2+r()*20)*HOUR)};
    }
  }
  return {ref, customer, tpl, from, to, start, lead:owners['Operations Manager'], tasks};
}
let SHIPMENTS = SHIPMENTS_SPEC.map(buildShipment);

/* =========================================================================
   Roll team tasks up into key milestones
   ========================================================================= */
function stagesOf(s){
  const keys = KEYS[s.tpl] || {};
  const stages = []; let cur = [];
  s.tasks.forEach(t=>{
    cur.push(t);
    if(Object.prototype.hasOwnProperty.call(keys, t.name)){ stages.push({label:keys[t.name] || t.name, trigger:t, tasks:cur}); cur=[]; }
  });
  if(cur.length) stages.push({label:'After last key milestone', trigger:null, tasks:cur});
  return stages;
}
const SEV = {breached:4, atrisk:3, ontrack:2, upcoming:1, late:0, done:0};
function evalStage(st, prevDone){
  const t = st.trigger, now = NOW.getTime();
  const doneCount = st.tasks.filter(x=>x.done).length;
  const base = {doneCount, total:st.tasks.length};
  if(!t) return {...base, state:'upcoming'};
  if(t.done){
    const lateBy = t.completedAt - t.due;
    return {...base, state: lateBy > 0 ? 'late' : 'done', lateBy};
  }
  const flagged = st.tasks.find(x=>!x.done && x.flag);
  const overdue = st.tasks.find(x=>!x.done && x !== t && x.due < now);
  if(t.due < now) return {...base, state:'breached', reason:`Overdue by ${dur(now - t.due)}`, reasonTask:t, flag:flagged};
  if(flagged) return {...base, state:'atrisk', reason:`Blocker on “${flagged.name}”: ${flagged.flag.note}`, reasonTask:flagged, flag:flagged, kind:'flag'};
  if(overdue) return {...base, state:'atrisk', reason:`Team task “${overdue.name}” is ${dur(now - overdue.due)} overdue`, reasonTask:overdue, kind:'task'};
  const openLeft = st.tasks.filter(x=>!x.done).length;
  if(t.due - now < DAY && openLeft > 1) return {...base, state:'atrisk', reason:`Due in ${dur(t.due - now)} with ${openLeft} team tasks still open`, reasonTask:t, kind:'tight'};
  const started = prevDone || doneCount > 0;
  return {...base, state: started ? 'ontrack' : 'upcoming'};
}
function analyse(s){
  const stages = stagesOf(s);
  let prevDone = true;
  const keyed = stages.map(st=>{
    const ev = evalStage(st, prevDone);
    if(st.trigger) prevDone = st.trigger.done;
    return {...st, ev};
  });
  const keys = keyed.filter(k=>k.trigger);
  const worst = keys.reduce((w,k)=> SEV[k.ev.state] > SEV[w] ? k.ev.state : w, 'done');
  const health = worst==='breached' ? 'breached' : worst==='atrisk' ? 'atrisk' : keys.every(k=>k.trigger.done) ? 'complete' : 'ontrack';
  const done = s.tasks.filter(t=>t.done).length;
  return {stages:keyed, keys, health, done, total:s.tasks.length};
}

/* Formatting */
function dur(ms){
  const m = Math.max(1, Math.round(ms/60e3));
  if(m < 60) return `${m}m`;
  const h = Math.round(m/60);
  if(h < 24) return `${h}h`;
  const d = Math.floor(h/24), rh = h%24;
  return rh ? `${d}d ${rh}h` : `${d}d`;
}
const fmtDay = d => d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
const fmtTime = d => d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
function relDay(d){
  const sod = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((sod(d)-sod(NOW))/DAY);
  if(diff===0) return `Today ${fmtTime(d)}`;
  if(diff===1) return `Tomorrow ${fmtTime(d)}`;
  if(diff===-1) return `Yesterday ${fmtTime(d)}`;
  return `${fmtDay(d)} ${fmtTime(d)}`;
}
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ICON = {
  check:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bang:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M12 6v8M12 18.5v.5" stroke-linecap="round"/></svg>',
  clock:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>',
  flag:'<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3v18h2v-7h9l-1.5-3.5L16 7H7V3z"/></svg>',
  flagLg:'<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3v18h2v-7h9l-1.5-3.5L16 7H7V3z"/></svg>',
  warn:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3l10 18H2z" stroke-linejoin="round"/><path d="M12 10v5M12 18v.5" stroke-linecap="round"/></svg>',
};
const STATE_META = {
  done:{label:'Hit SLA', pill:'ok'}, late:{label:'Completed late', pill:'bad'},
  breached:{label:'Breached', pill:'bad'}, atrisk:{label:'At risk', pill:'warn'},
  ontrack:{label:'In progress', pill:'neutral'}, upcoming:{label:'Not started', pill:'neutral'},
};
const HEALTH_META = { breached:{label:'Breached', pill:'bad'}, atrisk:{label:'At risk', pill:'warn'}, ontrack:{label:'On track', pill:'ok'}, complete:{label:'Complete', pill:'ok'} };
function glyph(state, flagged){
  const inner = {done:ICON.check, late:ICON.check, breached:ICON.bang, atrisk:ICON.clock, ontrack:'', upcoming:''}[state];
  const g = {done:'g-done', late:'g-late', breached:'g-breached', atrisk:'g-atrisk', ontrack:'g-ontrack', upcoming:'g-upcoming'}[state];
  return `<span class="glyph ${g}">${inner}${flagged?`<span class="flagmark">${ICON.flag}</span>`:''}</span>`;
}
function cellLabel(k){
  const t = k.trigger, e = k.ev;
  if(e.state==='done') return fmtDay(t.completedAt);
  if(e.state==='late') return `${fmtDay(t.completedAt)} · +${dur(e.lateBy)}`;
  if(e.state==='breached') return `${dur(NOW - t.due)} over`;
  if(e.state==='atrisk') return relDay(t.due).replace(/^(\d\d \w+) .*/, '$1');
  return fmtDay(t.due);
}

function seg(el, items, value, onPick){
  el.innerHTML = items.map(([v,l,c])=>`<button type="button" class="${v===value?'on':''}" data-v="${v}">${l}${c!==undefined?`<span class="c">${c}</span>`:''}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('button'); if(b){ onPick(b.dataset.v); } };
}

function renderPipeline(A){
  const q = UI.q.trim().toLowerCase();
  const list = A.filter(x=> x.a.health!=='complete'
    && (UI.tpl==='all' || x.s.tpl===UI.tpl)
    && (UI.health==='all' || x.a.health===UI.health)
    && (!q || x.s.ref.toLowerCase().includes(q) || x.s.customer.toLowerCase().includes(q)));
  const hs = {breached:0, atrisk:1, ontrack:2};
  const groups = TPL_ORDER.map(t=>({t, rows:list.filter(x=>x.s.tpl===t).sort((a,b)=> hs[a.a.health]-hs[b.a.health] || a.s.ref.localeCompare(b.s.ref))})).filter(g=>g.rows.length);
  if(!groups.length){ $('pipeline').innerHTML = `<div class="empty">No shipments match these filters.</div>`; return; }
  $('pipeline').innerHTML = groups.map(g=>{
    const tplTasks = TEMPLATES[g.t].tasks, keys = KEYS[g.t];
    const keyCols = tplTasks.filter(t=>Object.prototype.hasOwnProperty.call(keys,t.name));
    return `<div class="group">
      <div class="group-head"><h3>${TEMPLATES[g.t].label}</h3><span>${g.rows.length} shipment${g.rows.length===1?'':'s'} · ${keyCols.length} key of ${tplTasks.length} team tasks</span></div>
      <div class="tbl-wrap"><table class="matrix">
        <thead><tr><th>Shipment</th><th>Lead</th>${keyCols.map(t=>`<th class="key">${esc(keys[t.name]||t.name)}<small>${esc(t.name)}</small></th>`).join('')}<th>Team tasks</th><th>Health</th></tr></thead>
        <tbody>${g.rows.map(({s,a})=>`
          <tr class="row" data-ref="${s.ref}" tabindex="0">
            <td><div class="ship-ref">${s.ref}</div><div class="ship-cust">${esc(s.customer)}</div><div class="ship-route">${esc(s.from)} → ${esc(s.to)}</div></td>
            <td>${avatar(s.lead)}</td>
            ${a.keys.map((k,i)=>{ const fl = k.ev.state!=='done' && k.ev.state!=='late' && k.tasks.some(t=>!t.done && t.flag);
              return `<td class="${i===0?'first-key':''}" title="${esc(k.label)}: ${STATE_META[k.ev.state].label}${k.ev.reason?' — '+esc(k.ev.reason):''}"><div class="ms ${k.ev.state}">${glyph(k.ev.state, fl)}<span class="lbl">${cellLabel(k)}</span></div></td>`; }).join('')}
            <td class="tasks-cell"><div class="t">${a.done} / ${a.total}</div><div class="bar"><i style="width:${a.done/a.total*100}%"></i></div></td>
            <td><span class="pill ${HEALTH_META[a.health].pill}">${HEALTH_META[a.health].label}</span></td>
          </tr>`).join('')}</tbody>
      </table></div></div>`;
  }).join('');
}


/* Drawer: key milestone timeline + the team tasks feeding each one */
function renderDrawer(ref){
  const s = SHIPMENTS.find(x=>x.ref===ref); if(!s) return;
  const a = analyse(s);
  const lastDue = s.tasks[s.tasks.length-1].due;
  const openStages = new Set(a.stages.filter(st=> st.trigger ? !st.trigger.done && (st.ev.state==='breached'||st.ev.state==='atrisk'||st.ev.state==='ontrack') : false).map(st=>st.label));
  $('drawer').innerHTML = `
    <div class="drawer-head">
      <div class="row1">
        <div><div class="eyebrow">${TEMPLATES[s.tpl].label}</div><h2>${s.ref} · ${esc(s.customer)}</h2></div>
        <button class="btn btn-ghost" type="button" data-close aria-label="Close">✕</button>
      </div>
      <div class="facts">
        <div><div class="k">Route</div><div class="v">${esc(s.from)} → ${esc(s.to)}</div></div>
        <div><div class="k">Operations lead</div><div class="v">${TEAM[s.lead].name}</div></div>
        <div><div class="k">Health</div><div class="v"><span class="pill ${HEALTH_META[a.health].pill}">${HEALTH_META[a.health].label}</span></div></div>
        <div><div class="k">Job opened</div><div class="v num">${fmtDay(s.start)}</div></div>
        <div><div class="k">Planned close</div><div class="v num">${fmtDay(lastDue)}</div></div>
        <div><div class="k">Team tasks</div><div class="v num">${a.done} of ${a.total} done</div></div>
      </div>
    </div>
    <div class="drawer-body">
      <div class="demo-note"><b>Prototype:</b> the checkboxes below stand in for the team ticking tasks in this shipment's Progress tab. Tick one and watch the key milestone, and the pipeline update.</div>
      ${a.stages.map(st=>{
        const e = st.ev, t = st.trigger;
        const head = t ? `<div class="stage-top"><h4>${esc(st.label)}</h4><span class="pill ${STATE_META[e.state].pill}">${STATE_META[e.state].label}</span></div>
          <div class="stage-sub num">${t.done ? `Triggered by “${esc(t.name)}” · ${relDay(t.completedAt)} · SLA was ${relDay(t.due)}` : `Triggered by “${esc(t.name)}” · due ${relDay(t.due)}${t.sla?` · ${esc(t.sla)}`:''}`}</div>
          ${e.reason ? `<div class="stage-reason ${e.state==='breached'?'bad':'warn'}">${esc(e.reason)}</div>`:''}`
          : `<div class="stage-top"><h4 style="color:var(--muted)">${esc(st.label)}</h4></div><div class="stage-sub">Team tasks that don't feed a key milestone.</div>`;
        return `<div class="stage">
          <div class="spine">${t ? glyph(e.state, e.state!=='done'&&e.state!=='late'&&st.tasks.some(x=>!x.done&&x.flag)) : glyph('upcoming')}<span class="line"></span></div>
          <div class="stage-body">${head}
            <details class="team" ${openStages.has(st.label)?'open':''}>
              <summary><span>Team tasks in this stage</span><span class="num" style="color:var(--muted);font-weight:500">${e.doneCount}/${e.total} done</span></summary>
              ${st.tasks.map(x=>{
                const i = s.tasks.indexOf(x), over = !x.done && x.due < NOW;
                const right = x.done ? `<div class="td ${x.completedAt>x.due?'bad':'ok'}">${x.completedAt>x.due?`+${dur(x.completedAt-x.due)} late`:'On time'}<br><span class="muted" style="color:var(--muted);font-weight:400">${relDay(x.completedAt)}</span></div>`
                  : `<div class="td ${over?'bad':'muted'}">${over?`${dur(NOW-x.due)} over`:'Due'}<br><span style="font-weight:400">${relDay(x.due)}</span></div>`;
                return `<label class="task">
                  <input type="checkbox" data-task="${i}" ${x.done?'checked':''} aria-label="Mark ${esc(x.name)} complete">
                  <div><div class="tn">${esc(x.name)}${x===t?'<span class="star" title="Triggers this key milestone">★</span>':''}</div>
                    <div class="tm">${TEAM[x.owner].name} · ${esc(x.resp)}</div>
                    ${x.flag && !x.done ? `<div class="tf">${ICON.flagLg}<span>${esc(x.flag.note)} <span style="color:var(--muted)">— ${shortName(TEAM[x.flag.by].name)}, ${relDay(x.flag.at)}</span></span></div>`:''}
                  </div>${right}</label>`;
              }).join('')}
            </details>
          </div></div>`;
      }).join('')}
    </div>`;
}
function openDrawer(ref){ UI.open = ref; $('overlay').hidden = false; $('drawer').hidden = false; $('modal').hidden = true; renderDrawer(ref); $('drawer').querySelector('[data-close]').focus(); }
function closeAll(){ UI.open = null; $('overlay').hidden = true; $('drawer').hidden = true; $('modal').hidden = true; }

/* Configure which team tasks are key */
let draft = null, cfgTpl = 'oi';
function openConfig(){
  draft = JSON.parse(JSON.stringify(KEYS)); cfgTpl = UI.tpl!=='all' ? UI.tpl : 'oi';
  $('overlay').hidden = false; $('drawer').hidden = true; $('modal').hidden = false; UI.open = null;
  renderConfig();
}
function renderConfig(){
  const T = TEMPLATES[cfgTpl], d = draft[cfgTpl];
  const count = Object.keys(d).length;
  $('modal').innerHTML = `
    <div class="modal-head">
      <div class="row1"><div><h2 id="cfg-title">Choose key milestones</h2><p>Pick which tasks from the team's Progress list leadership should see. When the team ticks a key task, the milestone it triggers updates here.</p></div>
      <button class="btn btn-ghost" type="button" data-close aria-label="Close">✕</button></div>
      <div class="seg" id="cfg-tpl"></div>
    </div>
    <div class="modal-body">
      ${T.tasks.map((t,i)=>{ const on = Object.prototype.hasOwnProperty.call(d,t.name);
        return `<div class="cfg-row ${on?'on':''}">
          <span class="n">${i+1}</span>
          <div class="nm">${esc(t.name)}<small>${esc(t.resp)}${t.sla?` · ${esc(t.sla)}`:''}</small></div>
          <div class="lab"><input type="text" id="cfg-${cfgTpl}-${i}" data-label="${esc(t.name)}" value="${on?esc(d[t.name]):''}" placeholder="${on?'Name leadership sees':'Not shown to leadership'}" ${on?'':'disabled'} aria-label="Leadership name for ${esc(t.name)}"></div>
          <label class="toggle"><input type="checkbox" data-key="${esc(t.name)}" ${on?'checked':''}> Key</label>
        </div>`; }).join('')}
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" type="button" id="cfg-reset">Reset to defaults</button>
      <div style="display:flex;gap:8px;align-items:center"><span style="font-size:12px;color:var(--muted)">${count} of ${T.tasks.length} key</span>
        <button class="btn" type="button" data-close>Cancel</button><button class="btn btn-primary" type="button" id="cfg-save" ${count?'':'disabled'}>Save</button></div>
    </div>`;
  seg($('cfg-tpl'), TPL_ORDER.map(t=>[t, TEMPLATES[t].label, Object.keys(draft[t]).length]), cfgTpl, v=>{ cfgTpl=v; renderConfig(); });
}

function toast(html){
  const t = $('toast'); t.innerHTML = html; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.hidden = true; }, 3800);
}

/* Events */
document.addEventListener('click', e=>{
  if(e.target.closest('[data-close]') || e.target.id==='overlay'){ closeAll(); return; }
  const row = e.target.closest('tr.row'); if(row){ openDrawer(row.dataset.ref); return; }
  if(e.target.closest('#btn-config')){ openConfig(); return; }
  if(e.target.id==='cfg-reset'){ draft = JSON.parse(JSON.stringify(DEFAULT_KEYS)); renderConfig(); return; }
  if(e.target.id==='cfg-save'){ KEYS = draft; saveKeys(KEYS); closeAll(); renderAll(); toast('Key milestones saved. The pipeline now reflects your selection.'); return; }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeAll();
  if(e.key==='Enter' && e.target.matches('tr.row')) openDrawer(e.target.dataset.ref);
});
document.addEventListener('change', e=>{
  const cb = e.target;
  if(cb.matches('[data-task]') && UI.open){
    const s = SHIPMENTS.find(x=>x.ref===UI.open), t = s.tasks[+cb.dataset.task];
    NOW = new Date();
    t.done = cb.checked; t.completedAt = cb.checked ? new Date(NOW) : null;
    const isKey = Object.prototype.hasOwnProperty.call(KEYS[s.tpl], t.name);
    renderAll();
    const row = document.querySelector(`tr.row[data-ref="${s.ref}"]`); if(row) row.classList.add('flash');
    if(cb.checked && isKey) toast(`“${esc(t.name)}” ticked by the team → <b>${esc(KEYS[s.tpl][t.name]||t.name)}</b> is now complete for ${s.ref}.`);
    else if(cb.checked) toast(`“${esc(t.name)}” ticked by the team. Stage progress updated for ${s.ref}.`);
  }
  if(cb.matches('[data-key]')){
    const name = cb.dataset.key;
    if(cb.checked) draft[cfgTpl][name] = (DEFAULT_KEYS[cfgTpl][name]) || name; else delete draft[cfgTpl][name];
    renderConfig();
  }
});
document.addEventListener('input', e=>{
  if(e.target.id==='f-q'){ UI.q = e.target.value; renderAll(); }
  if(e.target.matches('[data-label]')){ draft[cfgTpl][e.target.dataset.label] = e.target.value; }
});

renderAll();
setInterval(renderAll, 60e3);
</script>
</body>
</html>
